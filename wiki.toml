# wiki.toml - Brian Knowledge Base Engine Manifest
# Edit freely. agent_rules = optional behaviors (see README → Customize).
# Re-run `wiki init` anytime, or change values here and restart your agents.
#
# Optional agent_rules (comma-separated list):
#   people_tracking  — keep pages for teammates, roles, ownership
#   asset_tracking   — laptops, licenses, access SOPs
#   security_notice  — never write secrets into wiki pages
#   adrs             — record architecture decisions
#   strict_sources   — require raw/ citations on new claims
#   quick_capture    — fast personal note synthesis
# Example to enable people tracking:
#   agent_rules = ["people_tracking"]

[wiki]
name = "Brian Knowledge Base"
short_name = "Brian Wiki"
description = "Company knowledge base — business, product, and operational context for Brian Knowledge Base"
version = "0.1.0"
use_case = "company"
agent_rules = []

[paths]
data_dir = "wiki"
raw_dir = "raw"
company_file = "wiki/entities/brian-overview.md"
registry_file = "internal/registry.md"

[upkeep]
triggers = [
    "A functionality-changing PR — new or renamed abstraction, changed architecture or data flow, a decision worth remembering",
    "Authoring or substantially revising a project document (.md, .html, .pdf) — spec, application, report"
]
instructions = """
Then say which page to add or update and why, and let the user decide. Never commit or push the wiki yourself.
Refactors, dependency bumps, tests and formatting need nothing — 'already current' is a valid answer; do not invent work.
"""
