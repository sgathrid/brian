[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brian-wiki"
version = "0.0.5"
description = "Universal LLM Knowledge Base Engine & Context Resolution CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "My Org", email = "team@example.com" }
]
keywords = ["llm", "wiki", "context", "knowledge-base", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.28,<2",
]

[project.scripts]
wiki = "wikicli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["wikicli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.11"
files = ["wikicli", "benchmarks"]
